[package]
name = "sop-loop"
version = "0.1.0"
description = "SOP Loop local-first personal execution system"
authors = ["SOP Loop"]
edition = "2021"

[lib]
name = "sop_loop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
